<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Fix it Marketplace</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/globals.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <div id="main-header"></div>

  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        
        <!-- Auth Header -->
        <div class="auth-header">
          <div class="auth-logo-badge" title="Fix it">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h1 class="auth-title">Create an Account</h1>
          <p class="auth-subtitle">Join Ghana's leading local services marketplace.</p>
        </div>

        <!-- Role Selector -->
        <div class="auth-role-selector">
          <label class="auth-role-option active" id="role-customer-label">
            <input type="radio" name="signup-role" value="customer" checked id="role-customer" />
            <div class="auth-role-text">
              <span class="auth-role-title">Customer</span>
              <span class="auth-role-desc">Hire local pros</span>
            </div>
          </label>

          <label class="auth-role-option" id="role-provider-label">
            <input type="radio" name="signup-role" value="provider" id="role-provider" />
            <div class="auth-role-text">
              <span class="auth-role-title">Provider</span>
              <span class="auth-role-desc">Offer services</span>
            </div>
          </label>
        </div>

        <!-- Social Sign-up -->
        <button type="button" class="auth-social-btn" id="btn-google-signup">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          Sign up with Google
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span>or sign up with email</span>
        </div>

        <!-- Form -->
        <form id="signup-form">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <div class="auth-input-group">
              <i class="fa-regular fa-user auth-input-icon"></i>
              <input 
                type="text" 
                id="signup-name" 
                class="auth-input" 
                placeholder="e.g. Ama Mensah" 
                required 
                autocomplete="name"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <div class="auth-input-group">
              <i class="fa-regular fa-envelope auth-input-icon"></i>
              <input 
                type="email" 
                id="signup-email" 
                class="auth-input" 
                placeholder="you@example.com" 
                required 
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <div class="auth-input-group">
              <i class="fa-solid fa-lock auth-input-icon"></i>
              <input 
                type="password" 
                id="signup-password" 
                class="auth-input" 
                placeholder="Create a strong password" 
                required 
                minlength="6"
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle-btn" id="toggle-signup-password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="password-hint">
              <i class="fa-solid fa-circle-check" style="color: #008744; font-size: 11px;"></i>
              <span>At least 6 characters with letters and numbers</span>
            </div>
          </div>

          <div class="auth-options-row" style="margin-top: 0.25rem;">
            <label class="auth-checkbox-label">
              <input type="checkbox" id="agree-terms" required checked />
              <span style="font-size: 12.5px;">I agree to the <a href="javascript:void(0)" style="color: #008744; font-weight: 600;">Terms</a> and <a href="javascript:void(0)" style="color: #008744; font-weight: 600;">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="auth-submit-btn" id="btn-submit-signup">
            <span id="signup-btn-text">Create Account</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <!-- Switch link -->
        <div class="auth-switch">
          Already have an account? <a href="/sign-in">Sign in</a>
        </div>

        <!-- Trust Note -->
        <div class="auth-trust-note">
          <i class="fa-solid fa-shield-halved"></i>
          <span>256-bit SSL encryption &bull; Verified marketplace</span>
        </div>

      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Clean header without search bar for auth page
      Components.renderHeader('#main-header', { showSearch: false });

      // Role selector logic
      const customerRadio = document.querySelector('#role-customer');
      const providerRadio = document.querySelector('#role-provider');
      const customerLabel = document.querySelector('#role-customer-label');
      const providerLabel = document.querySelector('#role-provider-label');
      const submitBtnText = document.querySelector('#signup-btn-text');

      function updateRoleUI() {
        if (providerRadio.checked) {
          customerLabel.classList.remove('active');
          providerLabel.classList.add('active');
          submitBtnText.textContent = 'Join as a Service Provider';
        } else {
          customerLabel.classList.add('active');
          providerLabel.classList.remove('active');
          submitBtnText.textContent = 'Create Customer Account';
        }
      }

      customerRadio?.addEventListener('change', updateRoleUI);
      providerRadio?.addEventListener('change', updateRoleUI);
      customerLabel?.addEventListener('click', () => { customerRadio.checked = true; updateRoleUI(); });
      providerLabel?.addEventListener('click', () => { providerRadio.checked = true; updateRoleUI(); });

      // Password visibility toggle
      const toggleBtn = document.querySelector('#toggle-signup-password');
      const passwordInput = document.querySelector('#signup-password');
      toggleBtn?.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword 
          ? '<i class="fa-regular fa-eye-slash"></i>' 
          : '<i class="fa-regular fa-eye"></i>';
      });

      // Google 1-Click Simulation
      document.querySelector('#btn-google-signup')?.addEventListener('click', () => {
        const role = providerRadio.checked ? 'provider' : 'customer';
        Auth.loginDemo(role).then(() => {
          window.location.href = role === 'provider' ? '/provider/dashboard' : '/';
        });
      });

      // Email Sign up form
      document.querySelector('#signup-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.querySelector('#signup-name').value.trim();
        const email = document.querySelector('#signup-email').value.trim();
        const role = providerRadio.checked ? 'provider' : 'customer';

        Auth.user = {
          id: 'usr_' + Date.now(),
          fullName: name,
          primaryEmail: email,
          imageUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
          role: role
        };

        localStorage.setItem('fixit_local_user', JSON.stringify(Auth.user));
        localStorage.setItem('fixit_role', role);

        if (role === 'provider') {
          window.location.href = '/provider/dashboard';
        } else {
          window.location.href = '/';
        }
      });
    });
  </script>
</body>
</html>
