<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — Fix it</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/globals.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <div id="main-header"></div>

  <main class="dashboard-container">
    <div style="margin-bottom: 2rem;">
      <h1 class="font-heading" style="font-size: 2rem; font-weight: 800; color: #222325;">My Bookings</h1>
      <p style="color: #62646a; margin-top: 0.25rem;">Manage your appointments, scheduled service tasks, and provider updates.</p>
    </div>

    <!-- Filter Tabs -->
    <div class="tabs" style="margin-bottom: 1.5rem;">
      <button class="tab-btn active" data-filter="all">All Bookings</button>
      <button class="tab-btn" data-filter="pending">Pending Confirmation</button>
      <button class="tab-btn" data-filter="confirmed">Confirmed</button>
      <button class="tab-btn" data-filter="completed">Completed</button>
      <button class="tab-btn" data-filter="cancelled">Cancelled</button>
    </div>

    <!-- Bookings Container -->
    <div id="bookings-list">
      <div style="display: flex; justify-content: center; padding: 4rem;">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/bookings.js"></script>
</body>
</html>
