<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Fix it</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/globals.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <div id="main-header"></div>

  <main class="dashboard-container">
    <div style="margin-bottom: 1.5rem;">
      <h1 class="font-heading" style="font-size: 2rem; font-weight: 800; color: #222325;">Direct Messages</h1>
      <p style="color: #62646a; margin-top: 0.25rem;">Chat directly with your booked professionals or customers.</p>
    </div>

    <!-- Chat App Layout -->
    <div style="display: grid; grid-template-columns: 320px 1fr; background: #fff; border: 1px solid #dadbdd; border-radius: 12px; height: 600px; overflow: hidden; box-shadow: var(--shadow-sm);">
      <!-- Sidebar / Conversations -->
      <div style="border-right: 1px solid #dadbdd; display: flex; flex-direction: column;">
        <div style="padding: 1rem; border-bottom: 1px solid #dadbdd; font-weight: 700; font-size: 15px;">
          Conversations
        </div>
        <div id="chat-conversations" style="overflow-y: auto; flex: 1; padding: 0.5rem;">
          <!-- Rendered by messages.js -->
        </div>
      </div>

      <!-- Active Chat Window -->
      <div style="display: flex; flex-direction: column; height: 100%; min-height: 0;">
        <div id="chat-message-history" style="flex: 1; overflow-y: auto; padding: 1.5rem; background: #fafafa; min-height: 0;">
          <!-- Messages -->
        </div>

        <form id="chat-input-form" style="display: flex; gap: 10px; padding: 1rem; border-top: 1px solid #dadbdd; background: #fff; flex-shrink: 0; align-items: center;">
          <div class="input-with-icon" style="flex: 1;">
            <i class="fa-regular fa-comment-dots input-icon"></i>
            <input type="text" id="chat-input" placeholder="Type your message here..." class="form-input" required />
          </div>
          <button type="submit" class="btn btn-primary" style="height: 42px; padding: 0 1.25rem; font-weight: 600; display: inline-flex; align-items: center;">
            <i class="fa-solid fa-paper-plane" style="margin-right: 6px;"></i>
            <span>Send</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/messages.js"></script>
</body>
</html>
