<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Fix it Marketplace</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/globals.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <div id="main-header"></div>

  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        
        <!-- Auth Header -->
        <div class="auth-header">
          <div class="auth-logo-badge" title="Fix it">
            <i class="fa-solid fa-screwdriver-wrench"></i>
          </div>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to manage your bookings and service requests.</p>
        </div>

        <!-- Social Sign-in -->
        <button type="button" class="auth-social-btn" id="btn-google-login">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          Continue with Google
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span>or sign in with email</span>
        </div>

        <!-- Form -->
        <form id="signin-form">
          <div class="form-group">
            <label class="form-label" for="signin-email">Email Address</label>
            <div class="auth-input-group">
              <i class="fa-regular fa-envelope auth-input-icon"></i>
              <input 
                type="email" 
                id="signin-email" 
                class="auth-input" 
                placeholder="you@example.com" 
                required 
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <div class="form-label">
              <span>Password</span>
              <a href="javascript:void(0)" onclick="alert('Password reset link has been dispatched to your email address.')">Forgot password?</a>
            </div>
            <div class="auth-input-group">
              <i class="fa-solid fa-lock auth-input-icon"></i>
              <input 
                type="password" 
                id="signin-password" 
                class="auth-input" 
                placeholder="Enter your password" 
                required 
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="auth-options-row">
            <label class="auth-checkbox-label">
              <input type="checkbox" id="remember-me" checked />
              <span>Remember me for 30 days</span>
            </label>
          </div>

          <button type="submit" class="auth-submit-btn">
            <span>Sign In to Fix it</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <!-- Quick Demo Profiles Section -->
        <div class="auth-demo-card">
          <div class="auth-demo-header">
            <span class="auth-demo-title">
              <i class="fa-solid fa-bolt"></i> Instant Demo Sign In
            </span>
            <span class="auth-demo-tag">Fast Access</span>
          </div>
          <div class="auth-demo-chips">
            <button type="button" class="auth-demo-btn" onclick="Auth.loginDemo('customer').then(() => window.location.href = '/')">
              <div class="auth-demo-user">
                <div class="auth-demo-avatar avatar-cust"><i class="fa-solid fa-user"></i></div>
                <div>
                  <div class="auth-demo-name">Ama Mensah <span class="auth-demo-role-badge">(Customer)</span></div>
                </div>
              </div>
              <i class="fa-solid fa-chevron-right auth-demo-arrow"></i>
            </button>

            <button type="button" class="auth-demo-btn" onclick="Auth.loginDemo('provider').then(() => window.location.href = '/provider/dashboard')">
              <div class="auth-demo-user">
                <div class="auth-demo-avatar avatar-prov"><i class="fa-solid fa-screwdriver-wrench"></i></div>
                <div>
                  <div class="auth-demo-name">Kofi Owusu <span class="auth-demo-role-badge">(Provider Pro)</span></div>
                </div>
              </div>
              <i class="fa-solid fa-chevron-right auth-demo-arrow"></i>
            </button>

            <button type="button" class="auth-demo-btn" onclick="Auth.loginDemo('admin').then(() => window.location.href = '/admin')">
              <div class="auth-demo-user">
                <div class="auth-demo-avatar avatar-admin"><i class="fa-solid fa-shield-halved"></i></div>
                <div>
                  <div class="auth-demo-name">Kwame <span class="auth-demo-role-badge">(Administrator)</span></div>
                </div>
              </div>
              <i class="fa-solid fa-chevron-right auth-demo-arrow"></i>
            </button>
          </div>
        </div>

        <!-- Switch link -->
        <div class="auth-switch">
          Don't have an account yet? <a href="/sign-up">Create an account</a>
        </div>

        <!-- Trust Note -->
        <div class="auth-trust-note">
          <i class="fa-solid fa-shield-halved"></i>
          <span>256-bit SSL encryption &bull; Verified marketplace</span>
        </div>

      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Clean header without search bar for auth page
      Components.renderHeader('#main-header', { showSearch: false });

      // Password visibility toggle
      const toggleBtn = document.querySelector('#toggle-password');
      const passwordInput = document.querySelector('#signin-password');
      toggleBtn?.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword 
          ? '<i class="fa-regular fa-eye-slash"></i>' 
          : '<i class="fa-regular fa-eye"></i>';
      });

      // Google 1-Click / Real OAuth
      document.querySelector('#btn-google-login')?.addEventListener('click', async () => {
        const btn = document.querySelector('#btn-google-login');
        const origHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Connecting to Google...';
        btn.disabled = true;
        try {
          await Auth.signInWithGoogle('/');
        } catch (err) {
          console.error(err);
          btn.innerHTML = origHtml;
          btn.disabled = false;
        }
      });

      // Email Sign in form
      document.querySelector('#signin-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.querySelector('#signin-email').value.trim();
        const password = document.querySelector('#signin-password').value;
        const submitBtn = document.querySelector('.auth-submit-btn');
        const origHtml = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span>Signing in...</span> <i class="fa-solid fa-circle-notch fa-spin"></i>';
        submitBtn.disabled = true;

        try {
          await Auth.signInWithEmail(email, password);
        } catch (err) {
          console.error(err);
        } finally {
          submitBtn.innerHTML = origHtml;
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
